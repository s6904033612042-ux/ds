<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ยืนยันการสั่งซื้อ — มหาชัยตรัยอนันต์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&family=Noto+Serif+Thai:wght@500;600&family=Noto+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="nav-logo">มหาชัยตรัยอนันต์</a>
    <nav class="nav-links">
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">สินค้า</a>
    </nav>
  </div>
</header>

<main class="section section--tight">
  <div class="container">

    <div class="section-heading">
      <h1>ยืนยันการสั่งซื้อ</h1>
      <p>กรอกข้อมูลติดต่อของคุณ แล้วเราจะดำเนินการจัดส่งให้เร็วที่สุด</p>
    </div>

    <form id="orderForm" class="order-form">

      <div class="form-field">
        <label for="items">รายการสินค้า</label>
        <input type="text" id="items" name="items" readonly>
      </div>

      <div class="form-field">
        <label for="total">ยอดรวม (บาท)</label>
        <input type="text" id="total" name="total" readonly>
      </div>

      <div class="form-field">
        <label for="customerName">ชื่อ-นามสกุล</label>
        <input type="text" id="customerName" name="customerName" required placeholder="ชื่อผู้สั่งซื้อ">
      </div>

      <div class="form-field">
        <label for="contact">เบอร์โทร / Line ID</label>
        <input type="text" id="contact" name="contact" required placeholder="เบอร์โทรหรือไลน์ไอดี">
      </div>

      <div class="form-field">
        <label for="note">หมายเหตุ</label>
        <textarea id="note" name="note" rows="3" placeholder="ที่อยู่จัดส่ง หรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
      </div>

      <button type="submit" class="btn btn-primary order-form__submit">ยืนยันสั่งซื้อ</button>

    </form>

  </div>
</main>

<footer class="footer">
  <div class="container">
    &copy; 2026 มหาชัยตรัยอนันต์
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
